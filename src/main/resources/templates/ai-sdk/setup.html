<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>AI Query SDK — Setup</title>
    <link rel="stylesheet" th:href="@{/ai-sdk/assets/styles.css}"/>
</head>
<body th:attr="data-base=@{/ai-sdk}">
<div th:replace="~{ai-sdk/fragments :: topbar}"></div>
<main>
    <h1>One-time admin setup</h1>
    <p class="sub">Exchange the deployment OTP for a permanent admin password. This page disappears once it is done — from then on you simply sign in.</p>

    <div class="card">
        <div id="status-msg" class="msg"></div>
        <label for="otp">Setup OTP</label>
        <input id="otp" type="password" autocomplete="one-time-code" placeholder="value of ai-sdk.security.otp"/>
        <label for="password">Admin password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="at least 12 characters"/>
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password"/>
        <div class="row" style="margin-top:16px">
            <button id="submit">Complete setup</button>
        </div>
        <div id="msg" class="msg"></div>
    </div>

    <div class="card">
        <h2>Deployment status</h2>
        <table>
            <tbody>
            <tr><td>Setup OTP configured</td><td id="s-otp" class="muted">checking…</td></tr>
            <tr><td>Dedicated read-only datasource</td><td id="s-ro" class="muted">checking…</td></tr>
            </tbody>
        </table>
    </div>
</main>
<script th:src="@{/ai-sdk/assets/app.js}"></script>
<script>
    const msg = document.getElementById('msg');
    const statusMsg = document.getElementById('status-msg');
    const submit = document.getElementById('submit');

    async function loadStatus() {
        try {
            const status = await AiSdk.request('/status');
            document.getElementById('s-otp').textContent = status.otpConfigured ? 'yes' : 'no';
            document.getElementById('s-ro').textContent = status.readOnlyEnforcement ? 'enforced (' + status.readOnlyEnforcement + ')' : 'unknown';
            if (status.setupCompleted) {
                window.location.href = AiSdk.base + '/auth';
                return;
            }
            if (!status.otpConfigured) {
                AiSdk.message(statusMsg, 'No setup OTP is configured for this deployment, so setup cannot be completed.', 'err');
                submit.disabled = true;
            }
        } catch (e) {
            AiSdk.message(statusMsg, e.message, 'err');
        }
    }

    submit.addEventListener('click', async () => {
        AiSdk.hide(msg);
        const password = document.getElementById('password').value;
        if (password.length < 12) {
            AiSdk.message(msg, 'Password must be at least 12 characters', 'err');
            return;
        }
        if (password !== document.getElementById('confirm').value) {
            AiSdk.message(msg, 'Passwords do not match', 'err');
            return;
        }
        try {
            await AiSdk.request('/setup', {
                method: 'POST',
                body: JSON.stringify({ otp: document.getElementById('otp').value, password })
            });
            submit.disabled = true;
            AiSdk.message(msg, 'Setup complete. Taking you to the sign-in page…', 'ok');
            setTimeout(() => { window.location.href = AiSdk.base + '/auth'; }, 800);
        } catch (e) {
            AiSdk.message(msg, e.message, 'err');
        }
    });

    loadStatus();
</script>
</body>
</html>
